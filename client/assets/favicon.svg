<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradient for the shield/lock -->
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <!-- Subtle glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle with dark theme -->
  <circle cx="32" cy="32" r="30" fill="#18181b"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- Privacy shield outline -->
  <path d="M32 8 L52 16 L52 30 C52 44 42 52 32 56 C22 52 12 44 12 30 L12 16 Z"
        fill="none"
        stroke="url(#orangeGradient)"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Lock body -->
  <rect x="24" y="28" width="16" height="14" rx="2"
        fill="url(#orangeGradient)"/>

  <!-- Lock shackle -->
  <path d="M27 28 L27 24 C27 20 29 18 32 18 C35 18 37 20 37 24 L37 28"
        fill="none"
        stroke="url(#orangeGradient)"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <!-- Lock keyhole -->
  <circle cx="32" cy="33" r="2" fill="#18181b"/>
  <rect x="31" y="33" width="2" height="4" rx="0.5" fill="#18181b"/>

  <!-- Encrypted signal waves -->
  <path d="M20 46 Q16 42 20 38"
        fill="none"
        stroke="#f97316"
        stroke-width="1.5"
        stroke-linecap="round"
        opacity="0.7"/>
  <path d="M16 48 Q10 42 16 36"
        fill="none"
        stroke="#f97316"
        stroke-width="1.5"
        stroke-linecap="round"
        opacity="0.4"/>

  <path d="M44 46 Q48 42 44 38"
        fill="none"
        stroke="#f97316"
        stroke-width="1.5"
        stroke-linecap="round"
        opacity="0.7"/>
  <path d="M48 48 Q54 42 48 36"
        fill="none"
        stroke="#f97316"
        stroke-width="1.5"
        stroke-linecap="round"
        opacity="0.4"/>

  <!-- Small accent dots for geek feel -->
  <circle cx="32" cy="12" r="1.5" fill="#f97316" opacity="0.8"/>
  <circle cx="18" cy="20" r="1" fill="#f97316" opacity="0.5"/>
  <circle cx="46" cy="20" r="1" fill="#f97316" opacity="0.5"/>
</svg>
